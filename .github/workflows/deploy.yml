name: Deploy HRIS to MonsterASP.NET

on:
  push:
    branches:
      - master
      - template_sneat
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 📦 Restore Dependencies
        run: dotnet restore HRIS.sln

      - name: 🔨 Build & Publish ASP.NET Core Release
        run: |
          dotnet publish HRIS.Web/HRIS.Web.csproj \
            -c Release \
            -o ./publish \
            --no-restore

      - name: 🚀 Deploy to MonsterASP.NET via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.MONSTERASP_FTP_SERVER }}
          username: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          password: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /wwwroot/
          protocol: ftp
          port: 21
